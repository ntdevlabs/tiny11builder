name: Build Tiny11 ISO

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: 'Windows 11 ISO download URL'
        required: true
        type: string
      script_type:
        description: 'Script type to use'
        required: true
        type: choice
        options:
          - tiny11maker
          - tiny11Coremaker
      enable_dotnet35:
        description: 'Enable .NET 3.5 (Core only)'
        required: false
        type: boolean
        default: false
      scratch_drive:
        description: 'Scratch drive letter (C-Z, leave empty for script root)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PowerShell
        shell: pwsh
        run: |
          # Set execution policy for current process
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          Write-Host "PowerShell execution policy set to Bypass for this session"

      - name: Download Windows ISO
        shell: pwsh
        run: |
          Write-Host "Downloading Windows ISO from: ${{ inputs.iso_url }}"
          $isoPath = "$env:RUNNER_TEMP\windows11.iso"
          Invoke-WebRequest -Uri "${{ inputs.iso_url }}" -OutFile $isoPath -UseBasicParsing
          Write-Host "ISO downloaded successfully: $isoPath"
          Write-Host "ISO_SIZE=$($(Get-Item $isoPath).Length)" >> $env:GITHUB_ENV

      - name: Mount ISO and get drive letter
        shell: pwsh
        id: mount_iso
        run: |
          $isoPath = "$env:RUNNER_TEMP\windows11.iso"
          Write-Host "Mounting ISO: $isoPath"
          
          # Verify ISO file exists
          if (-not (Test-Path $isoPath)) {
              Write-Error "ISO file not found: $isoPath"
              exit 1
          }
          
          Write-Host "ISO file size: $((Get-Item $isoPath).Length / 1GB) GB"
          
          # Mount ISO with StorageType option to ensure proper mounting
          Write-Host "Mounting disk image..."
          try {
              # Mount with StorageType ISO to ensure it mounts as a CD/DVD drive
              $mountResult = Mount-DiskImage -ImagePath $isoPath -PassThru -StorageType ISO -ErrorAction Stop
              Write-Host "Mount command executed successfully"
              Write-Host "Mount result: $mountResult"
          } catch {
              Write-Error "Failed to mount ISO: $_"
              exit 1
          }
          
          # Wait a bit longer for mount to complete
          Start-Sleep -Seconds 3
          
          # Wait for mount to complete and drive letter to be assigned
          Write-Host "Waiting for drive letter assignment..."
          $maxWaitTime = 15  # 15 seconds max wait
          $waitInterval = 1   # Check every second
          $elapsed = 0
          $driveLetter = $null
          $systemDrive = $env:SystemDrive -replace ':', ''
          
          Write-Host "System drive: $systemDrive"
          
          # Wait a moment for mount to settle
          Start-Sleep -Seconds 2
          
          # Simple approach: Find any drive (except system) with Windows files, accept it immediately
          # This is safe because on GitHub runner, only one ISO is mounted at a time
          Write-Host "Searching for Windows installation files..."
          
          $allDrives = Get-Volume | Where-Object { 
              $_.DriveLetter -ne $null -and $_.DriveLetter -ne $systemDrive 
          } | Select-Object -ExpandProperty DriveLetter
          
          Write-Host "Non-system drives found: $($allDrives -join ', ')"
          
          # Verify ISO is mounted
          $diskImage = Get-DiskImage -ImagePath $isoPath -ErrorAction SilentlyContinue
          if (-not ($diskImage -and $diskImage.Attached)) {
              Write-Error "ISO is not mounted or not attached"
              exit 1
          }
          
          Write-Host "ISO is mounted (disk number: $($diskImage.Number))"
          
          # Find drive with Windows files
          foreach ($letter in $allDrives) {
              $bootPath = "$letter`:\sources\boot.wim"
              $installPath = "$letter`:\sources\install.wim"
              $esdPath = "$letter`:\sources\install.esd"
              
              if ((Test-Path $bootPath) -or (Test-Path $installPath) -or (Test-Path $esdPath)) {
                  Write-Host "Found Windows files on drive: $letter"
                  
                  # Verify it's actually a Windows installation
                  if (Test-Path $bootPath) {
                      Write-Host "Confirmed: boot.wim found on drive $letter"
                  } elseif (Test-Path $installPath) {
                      Write-Host "Confirmed: install.wim found on drive $letter"
                  } elseif (Test-Path $esdPath) {
                      Write-Host "Confirmed: install.esd found on drive $letter"
                  }
                  
                  $driveLetter = $letter
                  Write-Host "Accepting drive $driveLetter as ISO mount point"
                  break
              }
          }
          
          # If still not found, wait a bit and retry
          if (-not $driveLetter) {
              Write-Host "Windows files not found yet, waiting up to $maxWaitTime seconds..."
              while ($elapsed -lt $maxWaitTime -and -not $driveLetter) {
                  Start-Sleep -Seconds $waitInterval
                  $elapsed += $waitInterval
                  
                  foreach ($letter in $allDrives) {
                      $bootPath = "$letter`:\sources\boot.wim"
                      $installPath = "$letter`:\sources\install.wim"
                      $esdPath = "$letter`:\sources\install.esd"
                      
                      if ((Test-Path $bootPath) -or (Test-Path $installPath) -or (Test-Path $esdPath)) {
                          $driveLetter = $letter
                          Write-Host "Found Windows files on drive: $driveLetter"
                          break
                      }
                  }
                  
                  if ($driveLetter) {
                      break
                  }
                  
                  Write-Host "Waiting for drive letter... ($elapsed seconds)"
              }
          }
          
          if (-not $driveLetter) {
              Write-Error "Failed to get drive letter after $elapsed seconds"
              Write-Host "Mount result: $mountResult"
              Write-Host "Disk image info:"
              Get-DiskImage -ImagePath $isoPath | Format-List
              Write-Host "Available volumes (excluding system drive):"
              Get-Volume | Where-Object { $_.DriveLetter -ne $null -and $_.DriveLetter -ne $systemDrive } | Format-List
              Write-Host "All partitions on mounted disk:"
              if ($diskImage) {
                  $allPartitions = Get-Partition -DiskNumber $diskImage.Number -ErrorAction SilentlyContinue
                  $allPartitions | Format-List
                  
                  # Try to assign drive letter manually if partition exists but has no letter
                  foreach ($partition in $allPartitions) {
                      if (-not $partition.DriveLetter) {
                          Write-Host "Found partition without drive letter. Attempting to assign..."
                          # Find next available drive letter
                          $usedLetters = Get-Volume | Where-Object { $_.DriveLetter -ne $null } | Select-Object -ExpandProperty DriveLetter
                          $availableLetters = ('D'..'Z') | Where-Object { $_ -notin $usedLetters }
                          if ($availableLetters) {
                              $newLetter = $availableLetters[0]
                              Write-Host "Assigning drive letter $newLetter to partition..."
                              try {
                                  Set-Partition -InputObject $partition -NewDriveLetter $newLetter -ErrorAction Stop
                                  Start-Sleep -Seconds 2
                                  $driveLetter = $newLetter
                                  Write-Host "Successfully assigned drive letter: $driveLetter"
                                  break
                              } catch {
                                  Write-Host "Failed to assign drive letter: $_"
                              }
                          }
                      }
                  }
              }
              
              if (-not $driveLetter) {
                  exit 1
              }
          }
          
          Write-Host "ISO mounted successfully to drive: $driveLetter"
          Write-Host "ISO_DRIVE=$driveLetter" >> $env:GITHUB_ENV
          
          # Final verification
          $bootWim = "$driveLetter`:\sources\boot.wim"
          $installWim = "$driveLetter`:\sources\install.wim"
          $installEsd = "$driveLetter`:\sources\install.esd"
          
          Write-Host "Verifying Windows installation files..."
          Write-Host "boot.wim exists: $(Test-Path $bootWim)"
          Write-Host "install.wim exists: $(Test-Path $installWim)"
          Write-Host "install.esd exists: $(Test-Path $installEsd)"
          
          if (-not (Test-Path $bootWim) -and -not (Test-Path $installWim) -and -not (Test-Path $installEsd)) {
              Write-Error "Windows installation files not found in mounted ISO at drive $driveLetter"
              exit 1
          }
          
          Write-Host "Windows installation files verified successfully"

      - name: Run Tiny11 Builder Script
        shell: pwsh
        id: build_script
        run: |
          $scriptType = "${{ inputs.script_type }}"
          $isoDrive = $env:ISO_DRIVE
          $scratchDrive = "${{ inputs.scratch_drive }}"
          
          Write-Host "Running script: $scriptType.ps1"
          Write-Host "ISO Drive: $isoDrive"
          Write-Host "Scratch Drive: $scratchDrive"
          Write-Host "Working Directory: $PWD"
          Write-Host "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE"
          
          # Use GITHUB_WORKSPACE as script root (repo root)
          $scriptRoot = $env:GITHUB_WORKSPACE
          if (-not $scriptRoot) {
              $scriptRoot = $PSScriptRoot
          }
          
          Write-Host "Script Root: $scriptRoot"
          
          # Set execution policy
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          
          # Verify wrapper scripts exist
          $makerWrapper = Join-Path $scriptRoot ".github\scripts\run-maker-automated.ps1"
          $coreWrapper = Join-Path $scriptRoot ".github\scripts\run-coremaker-automated.ps1"
          
          if ("$scriptType" -eq "tiny11maker") {
              if (-not (Test-Path $makerWrapper)) {
                  Write-Error "Wrapper script not found: $makerWrapper"
                  exit 1
              }
          } else {
              if (-not (Test-Path $coreWrapper)) {
                  Write-Error "Wrapper script not found: $coreWrapper"
                  exit 1
              }
          }
          
          # Run the appropriate script with proper error handling
          $exitCode = 0
          try {
              if ("$scriptType" -eq "tiny11maker") {
                  Write-Host "Using tiny11maker with parameters and automation"
                  $wrapperParams = @{
                      ISODrive = "$isoDrive`:"
                  }
                  if ("$scratchDrive" -ne "") {
                      $wrapperParams.ScratchDrive = "$scratchDrive"
                  }
                  & $makerWrapper @wrapperParams
                  $exitCode = $LASTEXITCODE
              } else {
                  Write-Host "Using tiny11Coremaker with automation wrapper"
                  & $coreWrapper -ISODrive "$isoDrive`:" -EnableDotNet35 ${{ inputs.enable_dotnet35 }}
                  $exitCode = $LASTEXITCODE
              }
              
              if ($exitCode -ne 0 -and $exitCode -ne $null) {
                  Write-Error "Script failed with exit code: $exitCode"
                  exit $exitCode
              }
              
              # Verify ISO was created (double-check, wrapper should have done this)
              $expectedIsoPath = Join-Path $scriptRoot "tiny11.iso"
              if (-not (Test-Path $expectedIsoPath)) {
                  Write-Error "Script completed but ISO file not found at: $expectedIsoPath"
                  Write-Host "Searching for ISO files in script root..."
                  Get-ChildItem -Path $scriptRoot -Filter "*.iso" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                      Write-Host "Found ISO: $($_.FullName)"
                      Write-Host "ISO_PATH=$($_.FullName)" >> $env:GITHUB_ENV
                  }
                  exit 1
              }
              
              Write-Host "ISO verified at: $expectedIsoPath"
              Write-Host "ISO_PATH=$expectedIsoPath" >> $env:GITHUB_ENV
          } catch {
              Write-Error "Error running script: $_"
              Write-Error "Exception: $($_.Exception.Message)"
              Write-Error "StackTrace: $($_.ScriptStackTrace)"
              exit 1
          }
          
          Write-Host "Script completed successfully"
          Write-Host "BUILD_SUCCESS=true" >> $env:GITHUB_ENV

      - name: Wait for script completion and find ISO
        shell: pwsh
        run: |
          Write-Host "Checking script completion status..."
          
          # Check if script was marked as successful
          if ($env:BUILD_SUCCESS -ne "true") {
              Write-Warning "Script may not have completed successfully"
          }
          
          Write-Host "Waiting for ISO file..."
          
          # Wait for script to finish (check every 30 seconds, max 20 minutes)
          $maxWaitTime = 1200  # 20 minutes
          $checkInterval = 30  # 30 seconds
          $elapsed = 0
          $isoFound = $false
          
          while ($elapsed -lt $maxWaitTime -and -not $isoFound) {
              Start-Sleep -Seconds $checkInterval
              $elapsed += $checkInterval
              
              # Check for ISO file in script root (repo root)
              $scriptRoot = $env:GITHUB_WORKSPACE
              Write-Host "Checking for ISO in: $scriptRoot ($elapsed seconds elapsed)"
              
              $isoFiles = Get-ChildItem -Path $scriptRoot -Filter "tiny11.iso" -ErrorAction SilentlyContinue
              if ($isoFiles) {
                  Write-Host "Found ISO file: $($isoFiles.FullName)"
                  Write-Host "ISO size: $([math]::Round($isoFiles.Length / 1GB, 2)) GB"
                  Write-Host "ISO_PATH=$($isoFiles.FullName)" >> $env:GITHUB_ENV
                  $isoFound = $true
                  break
              }
              
              Write-Host "Waiting for ISO file... ($elapsed seconds elapsed)"
          }
          
          if (-not $isoFound) {
              Write-Host "ISO file not found after waiting. Checking all locations..."
              
              # Check repo root
              $scriptRoot = $env:GITHUB_WORKSPACE
              Write-Host "Checking repo root: $scriptRoot"
              Get-ChildItem -Path $scriptRoot -Filter "*.iso" -ErrorAction SilentlyContinue | ForEach-Object {
                  Write-Host "Found ISO: $($_.FullName)"
              }
              
              # Check scratch drive if specified
              $scratchDrive = "${{ inputs.scratch_drive }}"
              if ($scratchDrive -ne "") {
                  $scratchPath = "$scratchDrive`:\tiny11"
                  Write-Host "Checking scratch path: $scratchPath"
                  if (Test-Path $scratchPath) {
                      Get-ChildItem -Path $scratchPath -Filter "*.iso" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                          Write-Host "Found ISO in scratch: $($_.FullName)"
                      }
                  }
              }
              
              # Check system drive
              $systemDrive = $env:SystemDrive
              $systemTiny11Path = "$systemDrive\tiny11"
              if (Test-Path $systemTiny11Path) {
                  Write-Host "Checking system drive: $systemTiny11Path"
                  Get-ChildItem -Path $systemTiny11Path -Filter "*.iso" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                      Write-Host "Found ISO in system drive: $($_.FullName)"
                  }
              }
              
              # Final check in repo root
              $isoFiles = Get-ChildItem -Path $scriptRoot -Filter "tiny11.iso" -ErrorAction SilentlyContinue
              if ($isoFiles) {
                  Write-Host "Found ISO file: $($isoFiles.FullName)"
                  Write-Host "ISO_PATH=$($isoFiles.FullName)" >> $env:GITHUB_ENV
              } else {
                  Write-Error "Failed to find tiny11.iso file after waiting $elapsed seconds"
                  Write-Host "Please check the build logs above for script execution errors"
                  exit 1
              }
          }

      - name: Upload Tiny11 ISO Artifact
        uses: actions/upload-artifact@v4
        if: env.ISO_PATH != ''
        with:
          name: tiny11-iso
          path: ${{ env.ISO_PATH }}
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup
        shell: pwsh
        if: always()
        run: |
          Write-Host "Cleaning up..."
          
          # Unmount ISO if still mounted
          $isoPath = "$env:RUNNER_TEMP\windows11.iso"
          if (Test-Path $isoPath) {
              try {
                  $diskImage = Get-DiskImage -ImagePath $isoPath -ErrorAction SilentlyContinue
                  if ($diskImage -and $diskImage.Attached) {
                      Write-Host "Unmounting ISO..."
                      Dismount-DiskImage -ImagePath $isoPath -ErrorAction Stop
                      Write-Host "ISO unmounted successfully"
                      
                      # Wait a moment for unmount to complete
                      Start-Sleep -Seconds 2
                  } else {
                      Write-Host "ISO is not currently mounted"
                  }
              } catch {
                  Write-Host "Warning: Could not unmount ISO: $_"
                  Write-Host "This is non-critical, continuing cleanup..."
              }
          } else {
              Write-Host "ISO file not found at expected path"
          }
          
          # Cleanup temp files
          if (Test-Path "$env:RUNNER_TEMP\windows11.iso") {
              Write-Host "Removing temporary ISO file..."
              Remove-Item -Path "$env:RUNNER_TEMP\windows11.iso" -Force -ErrorAction SilentlyContinue
          }
          
          Write-Host "Cleanup completed"

